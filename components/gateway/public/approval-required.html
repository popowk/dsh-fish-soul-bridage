<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fish-soul · 原版客户端尚无法安全加载</title><link rel="stylesheet" href="__bridge/shell.css"></head><body><main style="max-width:700px;margin:12vh auto;padding:30px"><h1>原版插件资源暂未通过自动校验</h1><p>网关会在启动和检测到资源变化时，自动比对当前安装版本的 npm 官方发布包及 SHA-512 完整性信息。无需手动审核或确认。</p><p>如果 npm 无法访问、文件与发布包不一致或新模块未通过校验，程序会优先使用此前已验证的旧版前端；只有没有可用安全快照时才显示本页。请查看启动窗口或 <a href="__bridge/version">版本状态</a> 的原因，不要关闭校验。</p><p>此检查不会更改插件设置、记忆或数据库；此前已验证的快照可以在离线时继续使用；第一次运行需要联网校验。</p></main></body></html>
