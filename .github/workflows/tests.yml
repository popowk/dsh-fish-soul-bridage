name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SnowLuma patch script syntax
        run: node --check scripts/Patch-SnowLuma-VMO.mjs
      - name: JavaScript tests
        run: npm test
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @('scripts/Start-All.ps1', 'components/gateway/deploy.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
