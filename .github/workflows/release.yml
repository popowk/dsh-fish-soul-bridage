name: Publish bundled Windows distribution from repository
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify single-launcher bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne (node -p "require('./package.json').version")) { throw 'VERSION mismatch' }
          npm test
          node --check scripts/Patch-SnowLuma-VMO.mjs
          $files = @('scripts/Start-All.ps1','components/gateway/deploy.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $snow = Join-Path $PWD 'components/snowluma'
          $necessary = @(
            'node.exe','index.mjs','release.json','client/index.html',
            'client/logo.png','client/assets/overview-page-Bm3ks5zC.css',
            'client/assets/router-_TYMdJui.vmo.js','native/snowluma-win32-x64.node'
          )
          foreach ($file in $necessary) {
            if (!(Test-Path (Join-Path $snow $file) -PathType Leaf)) { throw ('Missing SnowLuma runtime: ' + $file) }
          }
          & (Join-Path $snow 'node.exe') scripts/Patch-SnowLuma-VMO.mjs $snow --check
          if ($LASTEXITCODE -ne 0) { throw 'SnowLuma patch checksum preflight failed' }
          foreach ($file in @('client/assets/index-DolPqBYW.vmo.js','client/assets/router-_TYMdJui.vmo.js','client/assets/settings-page-C7mrOgzU.vmo.js')) {
            & (Join-Path $snow 'node.exe') --check (Join-Path $snow $file)
            if ($LASTEXITCODE -ne 0) { throw ('Invalid SnowLuma JS: '+$file) }
          }
          if (Test-Path 'components/dsh-desktop') { throw 'DSH Desktop installer must not be bundled' }
          if (Test-Path 'components/dsh-plugin') { throw 'fish-soul plugin installer must not be bundled' }
      - name: Create full Windows ZIP directly from tracked repo files
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          @'
          from pathlib import Path
          import subprocess,zipfile,hashlib
          version=Path('VERSION').read_text(encoding='utf-8-sig').strip()
          dest=Path(f'dsh-fish-soul-bridage-v{version}-Windows-Full.zip')
          files=[p.decode('utf-8') for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=7,allowZip64=True) as out:
              for name in files:
                  if name.startswith('.github/') or name.startswith('tests/') or name=='.gitignore':
                      continue
                  file=Path(name)
                  if not file.is_file():
                      raise RuntimeError('Tracked file missing: '+name)
                  if any(t in name.lower() for t in ('dsh-desktop/','dsh-plugin/','.credentials.yaml')):
                      raise RuntimeError('Forbidden bundled installer/secret: '+name)
                  out.write(file,'dsh-fish-soul-bridage/'+name)
          with zipfile.ZipFile(dest) as z:
              required=[
                'dsh-fish-soul-bridage/Start.cmd',
                'dsh-fish-soul-bridage/VERSION',
                'dsh-fish-soul-bridage/components/snowluma/node.exe',
                'dsh-fish-soul-bridage/components/snowluma/index.mjs',
                'dsh-fish-soul-bridage/components/snowluma/client/logo.png',
                'dsh-fish-soul-bridage/components/snowluma/client/assets/overview-page-Bm3ks5zC.css',
                'dsh-fish-soul-bridage/components/ayu/bridge.mjs',
                'dsh-fish-soul-bridage/components/gateway/server.mjs'
              ]
              for p in required: assert p in z.namelist(),p
              assert z.testzip() is None,'Corrupt ZIP'
          print('WINDOWS_FULL_ZIP',dest,'SIZE',dest.stat().st_size,
                'SHA256',hashlib.sha256(dest.read_bytes()).hexdigest())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows bundle creation failed' }
      - name: Publish Windows-Full ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + $env:VERSION
          $file = 'dsh-fish-soul-bridage-' + $tag + '-Windows-Full.zip'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub tag publication failed' }
          gh release create $tag $file --target $env:GITHUB_SHA --title "dsh-fish-soul-bridage $tag (Windows Full)" --notes 'Complete SnowLuma v2.4.2 and Node runtime, gateway and Ayu bridge tracked in GitHub repository. No DSH Desktop installer, no fish-soul plugin package. DSH Desktop and fish-soul plugin must already be installed or configured separately; system Python is used for VMO helper.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
