name: Publish versioned source release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source (without third-party binaries)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" <<'PY'
          import pathlib,sys,zipfile
          version=sys.argv[1]
          with zipfile.ZipFile('dsh-fish-soul-bridage-v'+version+'-source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for p in pathlib.Path('.').rglob('*'):
                  if (not p.is_file() or '.git' in p.parts or p.suffix.lower() in
                      ('.zip','.exe','.dll','.node','.pdb','.pem','.key') or
                      p.name in ('.env','.credentials.yaml')): continue
                  out.write(p,p.as_posix())
          PY
      - name: Publish versioned source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          FILE="dsh-fish-soul-bridage-$TAG-source.zip"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "dsh-fish-soul-bridage $TAG" \
              --notes 'Source-only release with SnowLuma v2.4.2 VMO asset hotfix. Third-party binaries are not redistributed. Real Windows/VMO validation is still required.'
          fi
