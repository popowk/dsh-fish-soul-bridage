name: Publish v1.0.0 source release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          fetch-depth: 0
      - name: Package source (without third-party SnowLuma binaries)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.')
          with zipfile.ZipFile('dsh-fish-soul-bridage-v1.0.0-source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for p in root.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or p.name.endswith('.zip'):
                      continue
                  out.write(p,p.as_posix())
          PY
      - name: Publish verified v1.0.0 source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TARGET="$(git rev-parse HEAD)"
          git tag -f v1.0.0 "$TARGET"
          git push origin +refs/tags/v1.0.0
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dsh-fish-soul-bridage-v1.0.0-source.zip --clobber
            gh release edit v1.0.0 --target "$TARGET" --notes 'Unified Gateway + Ayu TTS + SnowLuma launch integration. Source release only: SnowLuma binaries are not redistributed. For the full Windows bundle use the separately provided package. JavaScript and Windows PowerShell syntax CI passed; live Windows integration still requires validation.'
          else
            gh release create v1.0.0 dsh-fish-soul-bridage-v1.0.0-source.zip --target "$TARGET" --title 'dsh-fish-soul-bridage v1.0.0' --notes 'Unified Gateway + Ayu TTS + SnowLuma integration. Source only; licensed SnowLuma installation required.'
          fi
