name: Probe public SnowLuma distribution
on:
  push:
    paths: ['.github/workflows/probe-snowluma.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check user-provided SnowLuma download addresses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          urls=[
            'https://haha.tmd.pet/SnowLuma-v2.4.2-win-x64-BasePath-Overlay.zip',
            'https://pan.tmd.pet/down.php?hash=7fddc8958202eecea079bcb2ed8152a7',
          ]
          for n,url in enumerate(urls,1):
            print('SOURCE',n,flush=True)
            req=urllib.request.Request(url,headers={'Range':'bytes=0-31','User-Agent':'Mozilla/5.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                print('HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'LENGTH',r.headers.get('Content-Length'),'PREFIX',repr(r.read(8)),flush=True)
            except Exception as e:
              print('UNAVAILABLE',type(e).__name__,str(e)[:160],flush=True)
          PY
