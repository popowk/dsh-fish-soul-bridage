name: One-time v0.16.4 compatibility validation
on:
  push:
    branches: [main]
    paths:
      - 'components/gateway/tests/compat-0164.test.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run full Windows regression suite
        run: npm test
      - name: Validate the gateway and bundled frontend
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Start-All.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          & ./components/snowluma/node.exe scripts/Patch-SnowLuma-VMO.mjs components/snowluma --check
          if ($LASTEXITCODE -ne 0) { throw 'SnowLuma verification failed' }
